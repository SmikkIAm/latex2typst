[project]
name = "latex2typst"
version = "0.1.0"
description = "A Python transpiler that converts LaTeX documents into Typst markup. It handles sections, formatting, lists, tables and math."
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
latex2typst = "latex2typst.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
